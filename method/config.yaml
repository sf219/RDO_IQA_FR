# ICASSP 2027 -- perceptual weighted RDO in VVC with stochastic Hessian estimates
# Fixed configuration (plan Section 2), values resolved from the codebase on 2026-09-03.
# Items marked TODO must be filled before the 3.4 / 3.5 launches and then never changed.

codec:
  vtm_version: "VTM-23.8"                      # fork: VTM_WMSE (weighted-RDO patch)
  encoder_binary: VTM_WMSE/bin/EncoderAppStatic
  config_file: VTM_WMSE/cfg/encoder_intra_vtm.cfg
  mode: all-intra, 1 frame (-fr 1 -f 1)
  input: "--InputBitDepth=8 --OutputBitDepth=8 --InputChromaFormat=420"
  anchor: unmodified VTM, SSE RDO (same binary, no --WeightedRdo)
  perceptqpa: "--PerceptQPA=1"                 # boolean in VTM, no strength knob (qpa_baseline.py)
  weighted_rdo:
    flags: "--WeightedRdo=1 --WeightedRdoTau=<tau> --WeightedRdoq=1"
    diag_file_flag: --WeightedRdoFile=<map>.dat          # per-pixel weights, per plane
    block_file_flag: --WeightedRdoBlockFile=<map>.bh     # per-plane 8x8 tile Hessians
    block_size: 8                                        # read from the .bh header by the encoder
    block_cost: "D = sum over tiles t of e_t^T H_t e_t"  # RdCost::xGetSSEBlockHessian, full tile form, no reduction
    diag_cost:  "D = sum_i H_ii e_i^2"                   # RdCost::xGetSSEWeighted
    weighted_rdoq: "lambda_TU <- lambda / mean(w over TU)"  # IntraSearch.cpp; same for diag and block
    kernel: "exact, symmetric float kernel (2026-09-03); bitstreams identical to the original double kernel"
  chroma: per-plane maps; luma-only metrics (SSIM, MS-SSIM) ship identity weights for U/V
  normalisation:
    plane_norm: per_plane                                # encoder_global_norm=False
    encoder: "w <- (w + tau*mean) / ((1+tau)*mean)  (mean of the plane's diagonal = 1)"
    block:   "H_t <- (H_t + tau*mean*I) / ((1+tau)*mean)"
    uniform_weighting: "tau -> infinity"                 # suggest alpha = 1/(1+tau) in the paper: 0 = uniform, 1 = raw map

importance_map:
  metrics:
    SSIM:    {estimator: hutch,   space: Y,   impl: Common.utils.q_utils.ssim_func}
    MS_SSIM: {estimator: hutch,   space: Y,   impl: Common.utils.q_utils.ms_ssim_func}
    LPIPS:   {estimator: gn,      space: RGB, impl: "lpips 0.1.4, net=vgg (LPIPS-VGG)"}
    DISTS:   {estimator: gn,      space: RGB, impl: "DISTS_pytorch 0.1"}
  torch: "2.5.1+cu121, env tip_torch (local); 2.4.1+cu118, env cunet (remote); maps/scoring bit-comparable: same package versions"
  versions_verified_2026-09-04: "lpips 0.1.4 (v0.1 linear layers: vgg.pth md5 d507d7349b, alex.pth 9642209e2b; backbones torchvision vgg16-397923af / alexnet-owt-7be5be79, identical md5 on both machines); DISTS_pytorch 0.1; pytorch_msssim 1.0.0"
  msssim_protocol: "SINCE 4 Sept 2026 09:30 (user decision): standard MS-SSIM = pytorch_msssim.ms_ssim defaults (11-tap Gaussian, sigma 1.5, valid conv) on luma, week_7/msssim_std.py, used for maps AND scoring; all MS-SSIM maps/encodes redone, all existing results re-scored (rescore_msssim.py; originals in results/pre_sigma3/)"
  msssim_note_old: "Common.utils.q_utils.ms_ssim_func was NOT the reference MS-SSIM: Gaussian window sigma=3 (reference 1.5), symmetric padding; ssim_func uses sigma 1.5. Published MS-SSIM numbers (e.g. Yang & Bajic) use the standard sigma=1.5 implementation -- see the check of 2026-09-04"
  taylor_convention: "d(x, x+e) ~ 1/2 e^T H e"          # absorbed by mean-one normalisation
  diag_estimator:
    hutch: "diag(H) = (1/m) sum_k v_k * (H v_k), Rademacher v_k"                # SSIM, MS-SSIM
    gn:    "diag(H) = (2/m) sum_k (J^T v_k)^2, Gaussian v_k, H = 2 J^T J exactly at e=0"  # LPIPS, DISTS (sum-of-squares metrics); PSD by construction
  block_estimator:
    hutchblock: "M_t = (1/m) sum_k (H v_k)_t v_{k,t}^T, symmetrised (M + M^T)/2"
    gnblock:    "H_t = (2/m) sum_k (J^T v_k)_t (J^T v_k)_t^T"                   # PSD by construction
    note: "the encoder evaluates e^T M e, which equals e^T sym(M) e identically -- symmetrisation is not an ablation"
  positivity:
    diag:  "99.5-percentile clip of the raw diagonal, then per-plane normalisation (clip_pct=99.5)"
    block: "psd=none in all Table-1 runs (GN blocks are PSD; Hutchinson blocks would need eigh projection)"
    order: "clip/projection BEFORE normalisation (python side); tau shrink in the encoder AFTER"
  probes:
    m_default: 256                                       # Table 1 (dgn / dgnb8 runs)
    m_sweep: [16, 32, 64, 128, 256]
    batch: 4                                             # VJPs per pass; bit-identical to batch 1
    amp: false
  smoothing:
    sigma: 3.0                                           # pixel units, 8-bit range [0,255]
    rounds: "m / 16"                                     # jitter runs: R = 16 rounds of 16 probes at m=256
    default_R: 1                                         # no smoothing in Table 1; R=m/16 in the j3 configs
  seed: 0
  seed_extra: 1                                          # 3.4 row 6 only

strength_sweep:
  tau_values: [0.25, 0.5, 1, 2, 3, 4, 6]                  # measured on Kodak, 12 images (kodim01-12), older map sets (m and sigma per series in results/kodak_json/summary.csv)
  perceptqpa_ypsnr_cost: {ctc_n24: 8.10, old_n24: 7.68, old_n12: 6.98}   # % Y-PSNR BD-rate vs anchor; ctc = QPs 22-37 (pick_tau.py, work/qpa_cost.json), old = QPs 27-42
  # Sweep point nearest PerceptQPA's 12-image cost, per (metric, estimator), from the 12-image sweep:
  #   SSIM diag 0.5 | SSIM block 2 | MS-SSIM diag 0.5 | MS-SSIM block 1 | LPIPS diag 0.5 | LPIPS block 1 | DISTS diag 1 | DISTS block 4
  # Table-1 regeneration (m=256, R=1, 24 images) encodes each config at the three taus bracketing that point;
  # the default (carried to CLIC, 3.3b, 3.4, 3.6) is then the one of the three nearest the 24-image PerceptQPA cost.
  regen_tau_grid:
    SSIM:    {diag: [0.25, 0.5, 1], block: [1, 2, 4]}
    MS_SSIM: {diag: [0.25, 0.5, 1], block: [0.5, 1, 2]}
    LPIPS:   {diag: [0.25, 0.5, 1], block: [0.5, 1, 2]}
    DISTS:   {diag: [0.5, 1, 2],    block: [2, 4, 6]}
  default_tau_per_config: {SSIM_diag: 0.25, SSIM_block: 1, MS_SSIM_diag: 0.25, MS_SSIM_block: 1, LPIPS_diag: 0.5, LPIPS_block: 1, DISTS_diag: 1, DISTS_block: 2}   # FIXED 2026-09-03 21:50 from the 24-image CTC run (work/default_tau.json); carried to 3.3b, 3.4, 3.5, 3.6

data:
  kodak:
    source: Common/Images/KODAK/All                      # 24 x 768x512 -- ALL-LANDSCAPE variant (kodim04/09/10/17/18/19 rotated vs. the standard set)
    note: "TIP_Hess_v2/week_7/work/png is a Cool-chic side copy (8 files, standard orientation) -- never used by the VTM pipeline"
    qps: [22, 27, 32, 37]                                # JVET CTC set, decided 2026-09-03 evening (was 27-42; 27/32/37 encodes reused from cache)
  clic:
    source: Common/Images/CLIC/professional_valid/valid   # CLIC professional validation set, 41 images (professional_valid_2020.zip; the image-track validation set reused in 2021/2022), downloaded 2026-09-03
    selection_rule: "ALL 41 images; each cropped top-left to a multiple of 8 (at most 7 px off the right/bottom edge); 36 of 41 need the crop"
    staged: work/clic41 (LIST.txt maps original name and size to the cropped file); mean 2.22 Mpx
    taus: "three per config, the Kodak regen_tau_grid, so CLIC is interpolated to PerceptQPA's CLIC cost exactly like Kodak"
    split: "images 1-13 local (GTX 1080 Ti); 14-41 remote (RTX 2070: 22-41 first, then 14-21); identical per-probe seeds"
    superseded: "work/clic20 (first 20 of CLIC/CLIC/test_2022) -- not used"
  colour_conversion:
    command: "ffmpeg -y -i <png> -pix_fmt yuv420p -f rawvideo <yuv>"
    matrix: "swscale default = BT.601, limited range, 8-bit (NOT BT.709 -- do not change; all existing results use it)"

evaluation:
  rate: "bits per pixel from bitstream size"
  quality:
    psnr_y:  Y
    ssim:    Y
    ms_ssim: Y
    lpips:   "RGB, YUV->RGB with bilinear chroma upsampling (hessian_weights.yuv_to_rgb)"
    dists:   "RGB, same conversion"
    db: "LPIPS/DISTS: -10 log10(d);  SSIM/MS-SSIM: -10 log10(1 - s)"
  bd_rate: "4-point Bjontegaard, cubic polyfit in log-rate over the overlapping quality range (vvc_rdo_experiment._bd_rate); one implementation for every table"
  matched_cost: "linear interpolation along the tau sweep in the (Y-PSNR BD-rate, metric BD-rate) plane at PerceptQPA's Y-PSNR cost (matched_table.py --at); PerceptQPA cost recomputed, not hard-coded"
  complexity: "T_ours/T_anchor (encoding only, single-threaded, sequential) and T_map(m) per image, reported separately; hardware in caption"
  complexity_csv: "complexity_csv.py -> results/complexity/summary.csv (enc rows from work/timebench/*.log, map rows from bench/map_time.json)"
  complexity_note: "work/timebench (2026-08-31) = OLD double kernel (block 1.36-1.45x), superseded. work/timebench_v2 (2026-09-03, timebench_v2.sh, exact float kernel + diagonal-plane path, sequential, idle box): anchor 50.5 s/encode; diag 0.95-1.00x; block 1.09 (DISTS) - 1.18x (MS-SSIM, LPIPS). Map time: bench/map_time.json (kodim01, m=16..256)."

literature_protocol:                                       # 3.6 only
  vtm: "VTM-23.0 in the references; ours VTM-23.8 (footnote)"
  qps: [22, 27, 32, 37]
  psnr: RGB
  lpips: "LPIPS-Alex (requires LPIPS-Alex maps for the optimised configs, not only Alex evaluation)"

# 5 Sept 2026 -- memory-only change for 2K images (hessian_weights.py). Above ckpt_min_pixels the residual is
# evaluated lazily per group (DISTS stage / LPIPS layer): each group's parts are rebuilt in a fresh graph for
# every probe, back-propagated once with the matching slice of the same probe vector, and freed; cuDNN
# benchmark mode is off there (its workspaces alone add ~5 GiB at 2K). Same probes, same arithmetic
# (linearity); float summation order differs. Kodak (0.39 Mpx) is below the threshold: original path,
# maps verified unchanged (kodim01 LPIPS/DISTS within 1e-5 of the maps on disk).
gn_memory:
  ckpt_min_pixels: 1500000      # env HW_CKPT_MIN_PIXELS
  allocator: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True   # clic_local.sh
  probe_2048x1360: {dists: {peak_gib: 9.35, s_per_probe: 1.5}, lpips: {peak_gib: 7.99, s_per_probe: 1.3}}
  equality_vs_original: {grad_max_rel_diff: 6e-7}
